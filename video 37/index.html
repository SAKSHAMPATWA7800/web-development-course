<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigma Web Development</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:550px;
    border:2px solid gray;
    background:black;
}

.navbar{
    height:35px;
    background:pink;
    margin:10px;
}

.main{
    background:green;
    margin:10px;
    padding:25px;
    display:flex;
    justify-content:space-around;
}

.box1{
    width:180px;
    height:180px;
    background:lightpink;
}

.box2{
    width:180px;
    height:180px;
    background:cornflowerblue;
}

.textbox{
    width:80%;
    margin:25px auto;
    padding:25px;
    border:2px solid gray;
    border-radius:40px;
    color:white;
    text-align:center;
    font-size:28px;
}

.circle{
    width:30px;
    height:30px;
    background:orange;
    border-radius:50%;
    position:fixed;
    right:20px;
    bottom:20px;
}

.footer{
    height:40px;
    background:lavender;
    margin-top:50px;
}
</style>

</head>
<body>

<div class="container">

    <div class="navbar"></div>

    <div class="main">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>

    <div class="textbox">
        Welcome to this Sigma Web Development Express
    </div>

    <div class="footer"></div>

</div>

<div class="circle"></div>

</body>
</html>
