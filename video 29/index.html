<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design</title>

    <style>
        body{
            background-color: #e5e5e5;
        }

        .container{
            color: black;
        }

        .box{
            width: 340px;
            background-color: white;
            margin: auto;
            border: 1px solid lightgray;
            border-radius: 10px;
            padding: 20px;
        }

        div{
            border-radius: 10px;
        }

        img{
            border-radius: 15px;
            width: 300px;
            height: 200px;
        }

        .tag{
            border: 1px solid lightgray;
            border-radius: 20px;
            padding: 5px 10px;
            margin-right: 10px;
            color: gray;
        }

        button{
            border-radius: 20px;
            background-color: rgb(190, 234, 249);
            color: blue;
            border: none;
            padding: 10px 20px;
            display: block;
            margin: auto;
        }

        p{
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">

            <!-- card image -->
            <img src="programming-background-concept.jpg" alt="Card Image">

            <br><br>

            <span class="tag">Nature</span>
            <span class="tag">Lake</span>

            <h1>Lago di Braies</h1>

            <p>Lorem ipsum dolor sit amet.</p>
            <p>consectetur adipiscing elit. Consequatur</p>
            <p>sodales morbi dignissim sed diam,</p>
            <p>pharetra vitae ipsum odio.</p>

            <button>Read More</button>

        </div>
    </div>

</body>
</html>
