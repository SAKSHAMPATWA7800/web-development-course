<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on CSS Selectors</title>
    <style>
        .boxe:first-child {
            background-color: red;
        }

        .box::first-line {
            color: yellow;
        }
    </style>
</head>
<body>
    <div class="boxes">

        <div class="box">Hay I am a box</div>
        <div class="box">I am a box</div>
        <div class="box">I am a box</div>
    </div>
</body>
</html>
